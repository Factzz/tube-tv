name: Build Tube+ APK

# Downloads the original SmartTube source (pinned to a known-good version), applies the
# Apple TV style patch (tubetv-appletv.patch, stored next to this workflow), builds the APK
# in the cloud and publishes it as a GitHub Release. Nothing to install on your computer.
#
# Start it: Actions tab -> "Build Tube+ APK" -> Run workflow.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      # This repository (it holds the patch file)
      - uses: actions/checkout@v4

      - name: Get SmartTube source (pinned) and apply the Apple TV patch
        run: |
          git init src
          cd src
          git remote add origin https://github.com/yuliskov/SmartTube.git
          git fetch --depth 1 origin c8873b539d8463b3276d54e395f94e5cd2bd3198
          git checkout FETCH_HEAD
          git submodule update --init --recursive --depth 1
          git apply --whitespace=nowarn ../tubetv-appletv.patch
          # Tube+ identity (logo, name, colours, progress bar) is layered on top of the first patch
          git apply --whitespace=nowarn ../tubeplus-identity.patch
          # Tube+ glass design layer (backdrop, glass player bar, glass dialogs, lit focus) on top of both
          git apply --whitespace=nowarn ../tubeplus-glass.patch

          # Two Java files are edited here instead of inside the patch, so they cannot fail on small source differences
          python3 - <<'PY'
          import re, pathlib, sys

          def fail(msg, path, text):
              print('HOOK FAILED:', msg, path); print(text[:3500]); sys.exit(1)

          # 1) register the Tube Glass colour scheme as the LAST scheme and make it the default
          p = pathlib.Path('common/src/main/java/com/liskovsoft/smartyoutubetv2/common/prefs/MainUIData.java')
          t = p.read_text(encoding='utf-8')
          if 'App.Theme.AppleTV.Browse' not in t:
              key = 'mColorSchemes.add(new ColorScheme('
              n = t.count(key)
              if n == 0: fail('no ColorScheme list found', p, t)
              last = t.rfind(key)
              end = t.index('));', last) + 3
              if 'mContext' not in t[last:end]: fail('unexpected ColorScheme call', p, t[last-200:end+200])
              add = ('\n        // Tube Glass (YouTube x Apple TV). Keep LAST: its index is the default\n'
                     '        mColorSchemes.add(new ColorScheme(\n'
                     '                R.string.color_scheme_apple_tv,\n'
                     '                "App.Theme.AppleTV.Player",\n'
                     '                "App.Theme.AppleTV.Browse",\n'
                     '                "App.Theme.AppleTV.Preferences",\n'
                     '                mContext));')
              t = t[:end] + add + t[end:]
              t, k = re.subn(r'(mColorSchemeIndex\s*=\s*Helpers\.parseInt\(split,\s*3,\s*)\d+(\s*\))', r'\g<1>%d\2' % n, t)
              if k != 1: fail('default scheme index line not found', p, t)
              p.write_text(t, encoding='utf-8')
              print('MainUIData: Tube Glass registered as scheme', n)

          # 2) Glide must not use hardware bitmaps (the glass sidebar snapshots the screen into a software bitmap)
          p = pathlib.Path('smarttubetv/src/main/java/com/liskovsoft/smartyoutubetv2/tv/util/GlideCachingModule.java')
          t = p.read_text(encoding='utf-8')
          if 'disallowHardwareConfig' not in t:
              t, k = re.subn(r'(\w+)\.setDiskCache\([^;]*;',
                             lambda m: m.group(0) + '\n        ' + m.group(1) + '.setDefaultRequestOptions(new com.bumptech.glide.request.RequestOptions().disallowHardwareConfig());',
                             t, count=1)
              if k != 1: fail('setDiskCache not found', p, t)
              p.write_text(t, encoding='utf-8')
              print('GlideCachingModule: hardware bitmaps disabled')
          PY

      # Step A: the Android SDK installer (sdkmanager) needs JDK 17+
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install the SDK parts the project asks for
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-34" "build-tools;30.0.3" "ndk;21.0.6113669"

      # Step B: SmartTube itself must be built with JDK 14 or older (README); JDK 11 also fits Android Gradle Plugin 7.4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '11'

      - uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false

      - name: Build
        working-directory: src
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :smarttubetv:assembleStstableDebug

      - name: Publish APKs as a GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Tube+ build ${{ github.run_number }}
          body: "Install the *universal* APK on your Google TV."
          files: src/smarttubetv/build/outputs/apk/ststable/debug/*.apk
          fail_on_unmatched_files: true
